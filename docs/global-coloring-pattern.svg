<text x="459" y="268" text-anchor="middle" font-size="18">P</text>
<rect x="54" y="288" width="54" height="54" fill="#dbeafe"/>
<text x="81" y="322" text-anchor="middle" font-size="18">P</text>
<rect x="432" y="288" width="54" height="54" fill="#dbeafe"/>
<text x="459" y="322" text-anchor="middle" font-size="18">P</text>
<rect x="108" y="342" width="54" height="54" fill="#dbeafe"/>
<text x="135" y="376" text-anchor="middle" font-size="18">P</text>
<rect x="162" y="342" width="54" height="54" fill="#dbeafe"/>
