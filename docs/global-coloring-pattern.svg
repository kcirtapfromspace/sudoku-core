<text x="54" y="590" font-size="15">Each digit occupies at most 3 selected cells.</text>
<text x="54" y="614" font-size="15">4 digits fill at most 12 cells; 13 are required.</text>
<text x="54" y="638" font-size="15" font-weight="600">Therefore r2c8 = 1.</text>
</g></svg>
