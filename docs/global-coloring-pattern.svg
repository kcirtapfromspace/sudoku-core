<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" role="img" aria-labelledby="title desc">
<title id="title">Four-digit global Sudoku obstruction</title>
<desc id="desc">Thirteen selected cells in boxes one, three, four and six allow palette four, six, seven, eight. Row two column eight additionally allows one. Four independent selected cells cannot coexist, so one is forced in that guardian.</desc>
<rect width="600" height="650" fill="white"/>
<g font-family="system-ui,sans-serif" fill="#0f172a">
<text x="54" y="28" font-size="21" font-weight="600">Four-digit global obstruction</text>
<text x="54" y="49" font-size="14">P = {4, 6, 7, 8}</text>
<rect x="54" y="126" width="54" height="54" fill="#dbeafe"/>
<text x="81" y="160" text-anchor="middle" font-size="18">P</text>
<rect x="378" y="126" width="54" height="54" fill="#dbeafe"/>
<text x="405" y="160" text-anchor="middle" font-size="18">P</text>
<rect x="432" y="126" width="54" height="54" fill="#fde68a"/>
<text x="459" y="160" text-anchor="middle" font-size="14">1 or P</text>
<rect x="486" y="126" width="54" height="54" fill="#dbeafe"/>
<text x="513" y="160" text-anchor="middle" font-size="18">P</text>
<rect x="432" y="180" width="54" height="54" fill="#dbeafe"/>
<text x="459" y="214" text-anchor="middle" font-size="18">P</text>
