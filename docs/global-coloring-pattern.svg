<text x="513" y="376" text-anchor="middle" font-size="18">P</text>
<path d="M 54 72 V 558 M 54 72 H 540" fill="none" stroke="#0f172a" stroke-width="3"/>
<path d="M 108 72 V 558 M 54 126 H 540" fill="none" stroke="#94a3b8" stroke-width="1"/>
