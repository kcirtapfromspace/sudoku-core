name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-features --locked -- -D warnings

  coverage:
    name: Tests and production coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/coverage-build
      - name: Install coverage and test-runner tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,nextest
      - name: Run every test and enforce production coverage
        run: ./scripts/test-coverage.sh
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-coverage
          path: target/coverage/
          if-no-files-found: warn
