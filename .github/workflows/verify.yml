name: Formal Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERUS_VERSION: 0.2026.09.13.671956e

jobs:
  verus:
    name: Verus proofs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache Verus release
        id: cache-verus
        uses: actions/cache@v4
        with:
          path: ~/verus
          key: verus-${{ env.VERUS_VERSION }}-x86-linux
      - name: Download Verus release
        if: steps.cache-verus.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /tmp/verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q /tmp/verus.zip -d /tmp
          mv /tmp/verus-x86-linux "$HOME/verus"
      - name: Install pinned Rust toolchain for Verus
        run: |
          toolchain="$("$HOME/verus/verus" 2>&1 | grep -o '[0-9.]*-x86_64-unknown-linux-gnu' | head -1 || true)"
          if [ -n "$toolchain" ]; then rustup install "$toolchain"; fi
      - name: Verify
        run: ./scripts/verify.sh
