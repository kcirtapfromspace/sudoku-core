name: Non-modular research

on:
  push:
    branches: [main]
    paths:
      - 'research/nonmodular/**'
      - 'src/solver/three_house*'
      - 'src/solver/candidate_state.rs'
      - 'verification/three_house.rs'
      - '.github/workflows/nonmodular-research.yml'
  pull_request:
    branches: [main, 'codex/**']
    paths:
      - 'research/nonmodular/**'
      - 'src/solver/three_house*'
      - 'src/solver/candidate_state.rs'
      - 'verification/three_house.rs'
      - '.github/workflows/nonmodular-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nonmodular-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exact-checks:
    name: Exact research checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify three-house contradiction and baseline proof artifacts
        run: |
          python3 research/nonmodular/verify_three_house.py
          python3 research/nonmodular/verify_quadratic_baseline.py
          python3 research/nonmodular/verify_graph_exclusions.py
          python3 research/nonmodular/audit_three_house_independent.py
          python3 research/nonmodular/three_house_classification.py --no-canonical --permutation-check
          python3 research/nonmodular/real_game_verify.py
